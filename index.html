<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>嘉華中學 無人機校隊 國一4 訓練登記系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; height: 3px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-slate-200">

  <div id="syncLoader" class="fixed top-0 left-0 w-full h-1 bg-slate-200 overflow-hidden z-50 hidden">
    <div class="bg-slate-900 h-full animate-pulse w-full"></div>
  </div>

  <script>
    const ENV_ACCOUNTS = {
      ADMINS: {
        "50162": "chenyichen1106",
        "teacher01": "chenyichen1106"
      },
      STUDENTS: {
        "s50159": "50159",
        "s50167": "50167"
      }
    };

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlNzU6sVK9qWpbszb-v-aZMc1xJelyTx-NECyA0AeY6EkCsz9LRRUhb-3_TElpkMHO/exec";
  </script>

  <div id="app" class="w-full max-w-4xl mx-auto p-4 sm:p-6 flex-grow">
    
    <header class="border-b border-slate-200 pb-4 mb-6 flex flex-row justify-between items-center gap-2">
      <div>
        <div class="text-[10px] sm:text-xs font-semibold tracking-wider text-slate-400 uppercase">嘉華中學 無人機校隊</div>
        <h1 class="text-lg sm:text-2xl font-bold tracking-tight text-slate-900">國一4 訓練登記</h1>
      </div>
      <div id="navRight" class="hidden items-center gap-2">
        <span id="roleBadge" class="inline-flex items-center px-2 py-0.5 text-[11px] font-medium rounded-full bg-slate-100 text-slate-700 border border-slate-200"></span>
        <button id="adminToggleBtn" onclick="switchPortalView()" class="hidden text-xs px-2.5 py-1.5 border border-slate-300 text-slate-700 rounded-lg active:bg-slate-100">切換</button>
        <button onclick="logout()" class="text-xs px-2.5 py-1.5 text-rose-600 font-medium active:opacity-70">登出</button>
      </div>
    </header>

    <section id="viewLogin" class="max-w-sm mx-auto my-6 sm:my-12">
      <div class="bg-white border border-slate-200 p-6 sm:p-8 rounded-2xl shadow-sm">
        <h2 class="text-base font-semibold text-slate-900 mb-5 border-b border-slate-100 pb-3">身分驗證</h2>
        
        <div class="mb-5 flex border-b border-slate-200">
          <button id="tabStudent" onclick="setRole('student')" class="flex-1 py-2 text-sm font-medium border-b-2 border-slate-900 text-slate-900 text-center">一般學生</button>
          <button id="tabAdmin" onclick="setRole('admin')" class="flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 text-center">管理者</button>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1" id="userLabel">帳號 / 學號</label>
            <input type="text" id="username" required autocomplete="username" class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-slate-800" placeholder="請輸入帳號" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">密碼</label>
            <input type="password" id="password" required autocomplete="current-password" class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-slate-800" placeholder="請輸入密碼" />
          </div>
          <p id="loginError" class="text-xs text-rose-600 hidden"></p>
          <button type="submit" class="w-full bg-slate-900 text-white text-sm py-3 rounded-xl active:bg-slate-800 font-medium transition-all shadow-sm">登入系統</button>
        </form>
      </div>
    </section>

    <div id="viewMain" class="hidden">

      <div class="flex border-b border-slate-200 mb-6 overflow-x-auto custom-scrollbar">
        <button id="navBooking" onclick="switchTab('booking')" class="py-3 px-4 text-sm font-medium border-b-2 border-slate-900 text-slate-900 whitespace-nowrap">登記訓練</button>
        <button id="navCalendar" onclick="switchTab('calendar')" class="py-3 px-4 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">當月月曆與名單</button>
        <button id="navAdmin" onclick="switchTab('admin')" class="hidden py-3 px-4 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">管理員控制台</button>
      </div>

      <div id="tabContentBooking" class="space-y-6">
        <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-slate-900">預約訓練時段</h3>
            <button onclick="fetchCloudData()" class="text-xs text-slate-500 flex items-center gap-1 active:text-slate-900">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> 同步雲端
            </button>
          </div>
          <form onsubmit="handleRegistration(event)" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">選擇日期</label>
                <input type="date" id="regDate" required onchange="handleDateChange()" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
                <p id="dateNotice" class="text-xs text-slate-500 mt-1.5"></p>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">訓練時段</label>
                <select id="regTime" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800 bg-white">
                  <option value="">-- 請先選擇日期 --</option>
                </select>
              </div>
            </div>

            <div id="nightNotice" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 leading-relaxed">
              <strong>課後/夜間時段提醒：</strong> 如有晚自習或夜課輔，需向相關單位完成請假手續後才可登記訓練。
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">登記姓名</label>
              <input type="text" id="regStudentName" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" placeholder="請輸入真實姓名" />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">備註說明 (選填)</label>
              <textarea id="regNotes" rows="2" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" placeholder="特殊需求或說明..."></textarea>
            </div>

            <button type="submit" id="regSubmitBtn" class="w-full sm:w-auto bg-slate-900 text-white text-sm px-8 py-3 rounded-xl active:bg-slate-800 font-medium transition-all">確認送出登記</button>
          </form>
        </div>

        <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm">
          <h3 class="text-base font-semibold text-slate-900 mb-3">個人登記紀錄</h3>
          <div id="myRegistrationsList" class="space-y-2.5">
            <p class="text-xs text-slate-400 italic">資料載入中...</p>
          </div>
        </div>
      </div>

      <div id="tabContentCalendar" class="hidden space-y-4">
        <div class="bg-white border border-slate-200 p-4 sm:p-6 rounded-2xl shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 id="calendarMonthTitle" class="text-base sm:text-lg font-bold text-slate-900">月曆</h3>
            <div class="flex items-center gap-1.5">
              <button onclick="changeMonth(-1)" class="px-2.5 py-1 border border-slate-200 rounded-lg text-xs active:bg-slate-50">&larr; 上月</button>
              <button onclick="changeMonth(1)" class="px-2.5 py-1 border border-slate-200 rounded-lg text-xs active:bg-slate-50">下月 &rarr;</button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-px bg-slate-200 border border-slate-200 rounded-t-xl overflow-hidden text-center">
            <div class="bg-slate-50 py-1.5 text-[11px] font-semibold text-rose-500">日</div>
            <div class="bg-slate-50 py-1.5 text-[11px] font-semibold text-slate-600">一</div>
            <div class="bg-slate-50 py-1.5 text-[11px] font-semibold text-slate-600">二</div>
            <div class="bg-slate-50 py-1.5 text-[11px] font-semibold text-slate-600">三</div>
            <div class="bg-slate-50 py-1.5 text-[11px] font-semibold text-slate-600">四</div>
            <div class="bg-slate-50 py-1.5 text-[11px] font-semibold text-slate-600">五</div>
            <div class="bg-slate-50 py-1.5 text-[11px] font-semibold text-slate-600">六</div>
          </div>
          <div id="calendarGrid" class="grid grid-cols-7 gap-px bg-slate-200 border-x border-b border-slate-200 rounded-b-xl overflow-hidden min-h-[300px]">
          </div>
        </div>

        <div id="dayDetailCard" class="bg-white border border-slate-200 p-4 sm:p-6 rounded-2xl shadow-sm hidden">
          <h4 id="selectedDateTitle" class="text-xs font-bold text-slate-900 mb-3 border-b border-slate-100 pb-2">當日登記名單</h4>
          <div id="selectedDateRoster" class="space-y-2">
          </div>
        </div>
      </div>

      <div id="tabContentAdmin" class="hidden space-y-6">
        <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm">
          <h3 class="text-base font-semibold text-slate-900 mb-1">週六開放時段設定</h3>
          <p class="text-xs text-slate-500 mb-4">特定週六的開放狀態將實時同步給所有學生。</p>
          
          <form onsubmit="handleSaturdayConfig(event)" class="space-y-4 max-w-lg">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">選擇週六日期</label>
              <input type="date" id="adminSatDate" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">開放狀態</label>
              <select id="adminSatStatus" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800 bg-white">
                <option value="open">開放訓練</option>
                <option value="closed">不開放</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">指導老師指定時間區間</label>
              <input type="text" id="adminSatTime" placeholder="例如：09:00 ~ 12:00" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
            </div>
            <button type="submit" class="bg-slate-900 text-white text-xs px-5 py-2.5 rounded-xl font-medium active:bg-slate-800">儲存並同步至雲端</button>
          </form>
        </div>

        <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-slate-900">全校隊訓練登記總表</h3>
            <span id="regCountBadge" class="text-xs px-2.5 py-0.5 bg-slate-100 text-slate-600 rounded-full border border-slate-200">0 筆</span>
          </div>

          <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full text-left text-xs text-slate-600 border-collapse min-w-[500px]">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-900 font-semibold">
                  <th class="p-3">日期</th>
                  <th class="p-3">時段</th>
                  <th class="p-3">學生姓名</th>
                  <th class="p-3">帳號</th>
                  <th class="p-3">備註</th>
                  <th class="p-3 text-right">操作</th>
                </tr>
              </thead>
              <tbody id="adminTableBody">
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <footer class="mt-8 pt-4 border-t border-slate-200 text-center text-[11px] text-slate-400">
      <p>嘉華中學 無人機校隊 國一4 訓練登記系統 &copy; 2026</p>
    </footer>

  </div>

  <script>
    let currentRole = 'student'; 
    let currentUser = null;
    let activePortal = 'student'; 
    let currentTab = 'booking'; 
    
    let calendarYear = new Date().getFullYear();
    let calendarMonth = new Date().getMonth(); 

    let registrations = [];
    let saturdayConfigs = {};

    const WEEKDAY_TIME_OPTIONS = [
      { id: 'noon', label: '13:25 ~ 13:55 (午休時段)' },
      { id: 'night_early', label: '17:30 ~ 20:40 (課後/夜間時段)' },
      { id: 'night_late', label: '19:30 ~ 20:40 (夜間時段)' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('regDate').value = todayStr;
      handleDateChange();
    });

    async function fetchCloudData() {
      showLoader(true);
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        registrations = data.registrations || [];
        saturdayConfigs = data.satConfigs || {};
        
        renderRegistrations();
        if (currentTab === 'calendar') renderCalendar();
        if (currentTab === 'admin') renderAdminTable();
        handleDateChange();
      } catch (e) {
        console.error("雲端同步失敗:", e);
      } finally {
        showLoader(false);
      }
    }

    async function sendCloudAction(payload) {
      showLoader(true);
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        await fetchCloudData();
      } catch (e) {
        alert("網路連線失敗，請稍後再試！");
      } finally {
        showLoader(false);
      }
    }

    function showLoader(show) {
      const loader = document.getElementById('syncLoader');
      if (show) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }

    function setRole(role) {
      currentRole = role;
      const tabStudent = document.getElementById('tabStudent');
      const tabAdmin = document.getElementById('tabAdmin');
      
      if (role === 'student') {
        tabStudent.className = "flex-1 py-2 text-sm font-medium border-b-2 border-slate-900 text-slate-900 text-center";
        tabAdmin.className = "flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 text-center";
        document.getElementById('userLabel').innerText = "帳號 / 學號";
      } else {
        tabAdmin.className = "flex-1 py-2 text-sm font-medium border-b-2 border-slate-900 text-slate-900 text-center";
        tabStudent.className = "flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 text-center";
        document.getElementById('userLabel').innerText = "管理者帳號";
      }
      document.getElementById('loginError').classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');

      const targetUsers = (currentRole === 'admin') ? ENV_ACCOUNTS.ADMINS : ENV_ACCOUNTS.STUDENTS;

      if (targetUsers && targetUsers[userVal] && targetUsers[userVal] === passVal) {
        currentUser = { username: userVal, role: currentRole, name: userVal };
        loginSuccess();
      } else {
        errorEl.innerText = "帳號或密碼錯誤。";
        errorEl.classList.remove('hidden');
      }
    }

    function loginSuccess() {
      document.getElementById('viewLogin').classList.add('hidden');
      document.getElementById('viewMain').classList.remove('hidden');
      document.getElementById('navRight').classList.remove('hidden');
      document.getElementById('navRight').classList.add('flex');

      activePortal = currentUser.role;
      updateHeaderBadge();

      if (currentUser.role === 'admin') {
        document.getElementById('adminToggleBtn').classList.remove('hidden');
        document.getElementById('navAdmin').classList.remove('hidden');
      } else {
        document.getElementById('adminToggleBtn').classList.add('hidden');
        document.getElementById('navAdmin').classList.add('hidden');
      }

      document.getElementById('regStudentName').value = currentUser.name;
      switchTab('booking');
      fetchCloudData(); 
    }

    function logout() {
      currentUser = null;
      document.getElementById('viewLogin').classList.remove('hidden');
      document.getElementById('viewMain').classList.add('hidden');
      document.getElementById('navRight').classList.add('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    function switchPortalView() {
      if (!currentUser || currentUser.role !== 'admin') return;
      activePortal = activePortal === 'admin' ? 'student' : 'admin';
      updateHeaderBadge();
      switchTab(activePortal === 'admin' ? 'admin' : 'booking');
    }

    function updateHeaderBadge() {
      const badge = document.getElementById('roleBadge');
      if (activePortal === 'admin') {
        badge.innerText = `管理者 (${currentUser.username})`;
        badge.className = "inline-flex items-center px-2.5 py-0.5 text-xs font-medium bg-slate-900 text-white rounded-full";
      } else {
        badge.innerText = `學生 (${currentUser.username})`;
        badge.className = "inline-flex items-center px-2.5 py-0.5 text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 rounded-full";
      }
    }

    function switchTab(tab) {
      if (tab === 'admin' && (!currentUser || currentUser.role !== 'admin')) {
        alert("權限不足：普通學生無法存取管理員控制台！");
        return;
      }

      currentTab = tab;
      
      const tabBooking = document.getElementById('navBooking');
      const tabCalendar = document.getElementById('navCalendar');
      const tabAdmin = document.getElementById('navAdmin');

      const contentBooking = document.getElementById('tabContentBooking');
      const contentCalendar = document.getElementById('tabContentCalendar');
      const contentAdmin = document.getElementById('tabContentAdmin');

      [tabBooking, tabCalendar, tabAdmin].forEach(el => {
        el.className = "py-3 px-4 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap";
      });

      contentBooking.classList.add('hidden');
      contentCalendar.classList.add('hidden');
      contentAdmin.classList.add('hidden');

      if (tab === 'booking') {
        tabBooking.className = "py-3 px-4 text-sm font-medium border-b-2 border-slate-900 text-slate-900 whitespace-nowrap";
        contentBooking.classList.remove('hidden');
        renderRegistrations();
      } else if (tab === 'calendar') {
        tabCalendar.className = "py-3 px-4 text-sm font-medium border-b-2 border-slate-900 text-slate-900 whitespace-nowrap";
        contentCalendar.classList.remove('hidden');
        renderCalendar();
      } else if (tab === 'admin') {
        tabAdmin.className = "py-3 px-4 text-sm font-medium border-b-2 border-slate-900 text-slate-900 whitespace-nowrap";
        contentAdmin.classList.remove('hidden');
        renderAdminTable();
      }
    }

    function handleDateChange() {
      const dateVal = document.getElementById('regDate').value;
      const timeSelect = document.getElementById('regTime');
      const dateNotice = document.getElementById('dateNotice');
      const submitBtn = document.getElementById('regSubmitBtn');
      const nightNotice = document.getElementById('nightNotice');

      timeSelect.innerHTML = '';
      nightNotice.classList.add('hidden');

      if (!dateVal) {
        timeSelect.innerHTML = '<option value="">-- 請先選擇日期 --</option>';
        return;
      }

      const dateObj = new Date(dateVal + 'T00:00:00');
      const dayOfWeek = dateObj.getDay();

      if (dayOfWeek === 0) {
        dateNotice.innerText = "週日不開放登記訓練。";
        dateNotice.className = "text-xs text-rose-600 font-medium mt-1";
        timeSelect.innerHTML = '<option value="">-- 週日不開放 --</option>';
        submitBtn.disabled = true;
        submitBtn.className = "w-full sm:w-auto bg-slate-300 text-slate-500 text-sm px-6 py-3 rounded-xl cursor-not-allowed font-medium";
        return;
      }

      if (dayOfWeek === 6) {
        const satConfig = saturdayConfigs[dateVal];
        if (satConfig && satConfig.status === 'open') {
          dateNotice.innerText = `週六開放訓練（時段：${satConfig.timeSlot}）。`;
          dateNotice.className = "text-xs text-emerald-600 font-medium mt-1";
          
          const opt = document.createElement('option');
          opt.value = satConfig.timeSlot;
          opt.innerText = `週六時段：${satConfig.timeSlot}`;
          timeSelect.appendChild(opt);

          submitBtn.disabled = false;
          submitBtn.className = "w-full sm:w-auto bg-slate-900 text-white text-sm px-8 py-3 rounded-xl active:bg-slate-800 font-medium";
        } else {
          dateNotice.innerText = "該週六目前暫不開放登記。";
          dateNotice.className = "text-xs text-amber-600 font-medium mt-1";
          timeSelect.innerHTML = '<option value="">-- 週六暫不開放 --</option>';
          submitBtn.disabled = true;
          submitBtn.className = "w-full sm:w-auto bg-slate-300 text-slate-500 text-sm px-6 py-3 rounded-xl cursor-not-allowed font-medium";
        }
        return;
      }

      dateNotice.innerText = "週一至週五正常開放時段。";
      dateNotice.className = "text-xs text-slate-500 mt-1";
      submitBtn.disabled = false;
      submitBtn.className = "w-full sm:w-auto bg-slate-900 text-white text-sm px-8 py-3 rounded-xl active:bg-slate-800 font-medium";

      WEEKDAY_TIME_OPTIONS.forEach(opt => {
        const optionEl = document.createElement('option');
        optionEl.value = opt.label;
        optionEl.innerText = opt.label;
        timeSelect.appendChild(optionEl);
      });

      timeSelect.addEventListener('change', checkNightNotice);
      checkNightNotice();
    }

    function checkNightNotice() {
      const timeVal = document.getElementById('regTime').value;
      const nightNotice = document.getElementById('nightNotice');
      if (timeVal.includes('17:30') || timeVal.includes('19:30')) {
        nightNotice.classList.remove('hidden');
      } else {
        nightNotice.classList.add('hidden');
      }
    }

    async function handleRegistration(e) {
      e.preventDefault();
      const dateVal = document.getElementById('regDate').value;
      const timeVal = document.getElementById('regTime').value;
      const studentName = document.getElementById('regStudentName').value.trim();
      const notes = document.getElementById('regNotes').value.trim();

      if (!dateVal || !timeVal || !studentName) {
        alert("請完整填寫日期、時段與姓名。");
        return;
      }

      const newRecord = {
        action: 'addRegistration',
        id: 'reg_' + Date.now(),
        date: dateVal,
        time: timeVal,
        studentName: studentName,
        account: currentUser.username,
        notes: notes,
        createdAt: new Date().toISOString()
      };

      await sendCloudAction(newRecord);
      alert("訓練登記成功並已同步至雲端！");
      document.getElementById('regNotes').value = '';
    }

    function renderRegistrations() {
      const container = document.getElementById('myRegistrationsList');
      if (!currentUser) return;
      
      const myRegs = registrations.filter(r => r.account === currentUser.username);

      if (myRegs.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 italic">尚無登記紀錄</p>';
        return;
      }

      container.innerHTML = myRegs.map(r => `
        <div class="flex justify-between items-center p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700">
          <div>
            <div class="font-bold text-slate-900 mb-0.5">${r.date}</div>
            <div class="text-[11px] text-slate-600">${r.time}</div>
            <div class="text-[11px] text-slate-500 mt-1">姓名: ${r.studentName} ${r.notes ? `(${r.notes})` : ''}</div>
          </div>
          <button onclick="cancelRegistration('${r.id}')" class="px-3 py-1.5 text-rose-600 bg-rose-50 border border-rose-100 rounded-lg text-xs font-medium active:bg-rose-100">取消</button>
        </div>
      `).join('');
    }

    async function cancelRegistration(id) {
      const targetRecord = registrations.find(r => r.id === id);
      if (!targetRecord) return;

      if (currentUser.role !== 'admin' && targetRecord.account !== currentUser.username) {
        alert("權限不足：您只能取消自己的訓練登記！");
        return;
      }

      if (!confirm("確定要取消此筆登記嗎？")) return;
      
      await sendCloudAction({ action: 'deleteRegistration', id: id });
    }

    function changeMonth(delta) {
      calendarMonth += delta;
      if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear--;
      } else if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear++;
      }
      renderCalendar();
    }

    function renderCalendar() {
      const titleEl = document.getElementById('calendarMonthTitle');
      const gridEl = document.getElementById('calendarGrid');
      gridEl.innerHTML = '';

      const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
      titleEl.innerText = `${calendarYear} 年 ${monthNames[calendarMonth]}`;

      const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
      const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "bg-white p-1 min-h-[55px] sm:min-h-[75px] opacity-30";
        gridEl.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const mStr = String(calendarMonth + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateStr = `${calendarYear}-${mStr}-${dStr}`;
        const dayOfWeek = new Date(calendarYear, calendarMonth, day).getDay();
        
        const dayRegs = registrations.filter(r => r.date === dateStr);
        const uniqueAttendees = [...new Set(dayRegs.map(r => r.studentName))];

        const cell = document.createElement('div');
        cell.className = "bg-white p-1.5 sm:p-2 min-h-[60px] sm:min-h-[75px] flex flex-col justify-between active:bg-slate-100 cursor-pointer border-t border-slate-100 transition-colors";
        cell.onclick = () => selectCalendarDay(dateStr, dayOfWeek, dayRegs);

        let statusDot = '';
        if (dayOfWeek === 0) statusDot = '<span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>';
        else if (dayOfWeek === 6) {
          const satConfig = saturdayConfigs[dateStr];
          statusDot = (satConfig && satConfig.status === 'open') ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>' : '';
        }

        cell.innerHTML = `
          <div>
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold text-slate-800">${day}</span>
              ${statusDot}
            </div>
            ${uniqueAttendees.length > 0 ? `
              <div class="mt-1">
                <span class="inline-block px-1.5 py-0.2 text-[9px] sm:text-[10px] font-bold bg-slate-900 text-white rounded-full">
                  ${uniqueAttendees.length} 人
                </span>
              </div>
            ` : ''}
          </div>
        `;

        gridEl.appendChild(cell);
      }
    }

    function selectCalendarDay(dateStr, dayOfWeek, dayRegs) {
      const card = document.getElementById('dayDetailCard');
      const title = document.getElementById('selectedDateTitle');
      const roster = document.getElementById('selectedDateRoster');

      card.classList.remove('hidden');
      const weekNames = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
      title.innerText = `${dateStr} (${weekNames[dayOfWeek]}) 訓練人數清單 (${dayRegs.length}人)`;

      if (dayRegs.length === 0) {
        roster.innerHTML = '<p class="text-xs text-slate-400 italic">當日尚無登記人員</p>';
        return;
      }

      roster.innerHTML = dayRegs.map(r => `
        <div class="flex justify-between items-center text-xs p-2.5 bg-slate-50 rounded-xl border border-slate-200">
          <div>
            <span class="font-bold text-slate-900 mr-1">${r.studentName}</span>
            <span class="text-slate-500 text-[11px]">${r.time}</span>
          </div>
          ${r.notes ? `<span class="text-slate-400 text-[10px]">${r.notes}</span>` : ''}
        </div>
      `).join('');
    }

    async function handleSaturdayConfig(e) {
      e.preventDefault();
      const dateVal = document.getElementById('adminSatDate').value;
      const statusVal = document.getElementById('adminSatStatus').value;
      const timeVal = document.getElementById('adminSatTime').value.trim();

      if (!dateVal) return;

      const dateObj = new Date(dateVal + 'T00:00:00');
      if (dateObj.getDay() !== 6) {
        alert("請選擇正確的「星期六」日期！");
        return;
      }

      await sendCloudAction({
        action: 'setSatConfig',
        date: dateVal,
        status: statusVal,
        timeSlot: timeVal || '社師指定時段'
      });

      alert("週六時間與狀態已同步至雲端！");
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminTableBody');
      const badge = document.getElementById('regCountBadge');

      badge.innerText = `${registrations.length} 筆`;

      if (registrations.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400 italic">目前沒有任何登記資料</td></tr>';
        return;
      }

      const sorted = [...registrations].sort((a, b) => new Date(b.date) - new Date(a.date));

      tbody.innerHTML = sorted.map(r => `
        <tr class="border-b border-slate-100 hover:bg-slate-50">
          <td class="p-3 font-medium text-slate-900 whitespace-nowrap">${r.date}</td>
          <td class="p-3 text-[11px]">${r.time}</td>
          <td class="p-3 font-bold text-slate-800 whitespace-nowrap">${r.studentName}</td>
          <td class="p-3 text-slate-500">${r.account}</td>
          <td class="p-3 text-slate-500">${r.notes || '-'}</td>
          <td class="p-3 text-right whitespace-nowrap">
            <button onclick="cancelRegistration('${r.id}')" class="text-rose-600 font-medium">刪除</button>
          </td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
