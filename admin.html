<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>控制面板 - 嘉華中學國一4無人機校隊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-50">
  <div id="syncLoader" class="fixed top-0 left-0 w-full h-1 bg-slate-200 overflow-hidden z-50 hidden">
    <div class="bg-slate-900 h-full animate-pulse w-full"></div>
  </div>

  <div id="app" class="w-full max-w-4xl mx-auto p-4 sm:p-6 flex-grow">
    <div class="space-y-6">
      
      <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm">
        <h3 class="text-base font-semibold text-slate-900 mb-1">週六開放與行事曆設定</h3>
        <p class="text-xs text-slate-500 mb-4">在此設定週六是否開放訓練、開放時段，並可直接同步寫入月曆事件。</p>
        
        <form onsubmit="handleSaturdaySubmit(event)" class="space-y-4 max-w-lg">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">選擇週六日期</label>
            <input type="date" id="adminSatDate" required onchange="validateSaturday(this)" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
            <p id="satDateCheckNotice" class="text-xs text-rose-500 mt-1 hidden">⚠️ 請選擇正確的「星期六」！</p>
          </div>
          
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">週六開放狀態</label>
            <select id="adminSatStatus" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800 bg-white">
              <option value="open">開放訓練</option>
              <option value="paused">暫停開放 / 放假</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">開放時段 (例如：09:00 ~ 12:00)</label>
            <input type="text" id="adminSatTimeSlot" placeholder="例如：09:00 ~ 12:00" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">新增週六行事曆事件 (選填，將顯示於月曆上)</label>
            <input type="text" id="adminSatEventText" placeholder="例如：週六自主集訓 / 校隊測驗" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
          </div>

          <button type="submit" class="bg-slate-900 text-white text-xs px-5 py-2.5 rounded-xl font-medium active:bg-slate-800">儲存週六設定並同步雲端</button>
        </form>
      </div>

      <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm">
        <h3 class="text-base font-semibold text-slate-900 mb-1">平日 / 任意日期行事曆與暫停設定</h3>
        <p class="text-xs text-slate-500 mb-4">可用於平日暫停開放（如段考週）、新增比賽/維修等行事曆事件。</p>
        
        <form onsubmit="handleGeneralDateSubmit(event)" class="space-y-4 max-w-lg">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">選擇日期</label>
            <input type="date" id="adminGeneralDate" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
          </div>
          
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">開放狀態</label>
            <select id="adminGeneralStatus" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800 bg-white">
              <option value="normal">依預設規則（平日開放）</option>
              <option value="paused">單獨暫停開放（如：考前暫停、放假）</option>
              <option value="open">特定開放</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">行事曆文字標籤 (將同步顯示於月曆與名單頁)</label>
            <input type="text" id="adminGeneralEventText" placeholder="例如：期中考週暫停 / 無人機保養" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-800" />
          </div>

          <button type="submit" class="bg-slate-900 text-white text-xs px-5 py-2.5 rounded-xl font-medium active:bg-slate-800">儲存日期設定並同步雲端</button>
        </form>
      </div>

      <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-semibold text-slate-900">全校隊訓練登記總表</h3>
          <span id="regCountBadge" class="text-xs px-2.5 py-0.5 bg-slate-100 text-slate-600 rounded-full border border-slate-200">0 筆</span>
        </div>

        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full text-left text-xs text-slate-600 border-collapse min-w-[500px]">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-slate-900 font-semibold">
                <th class="p-3">日期</th>
                <th class="p-3">時段</th>
                <th class="p-3">學生姓名</th>
                <th class="p-3">帳號</th>
                <th class="p-3">備註</th>
                <th class="p-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="adminTableBody">
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    let cloudData = { registrations: [], dateConfigs: {}, customEvents: {} };

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth(true);
      renderNavbar('admin');

      loadCloudData((data) => {
        cloudData = data;
        renderAdminTable();
      });
    });

    function validateSaturday(input) {
      const notice = document.getElementById('satDateCheckNotice');
      if (!input.value) return;
      const day = new Date(input.value + 'T00:00:00').getDay();
      if (day !== 6) {
        notice.classList.remove('hidden');
      } else {
        notice.classList.add('hidden');
      }
    }

    async function handleSaturdaySubmit(e) {
      e.preventDefault();
      const dateVal = document.getElementById('adminSatDate').value;
      const statusVal = document.getElementById('adminSatStatus').value;
      const timeSlotVal = document.getElementById('adminSatTimeSlot').value.trim() || '09:00 ~ 12:00';
      const eventTextVal = document.getElementById('adminSatEventText').value.trim();

      if (!dateVal) return;
      const day = new Date(dateVal + 'T00:00:00').getDay();
      if (day !== 6) {
        alert("請選擇正確的「星期六」日期！");
        return;
      }

      await sendCloudAction({
        action: 'setDateControl',
        date: dateVal,
        status: statusVal,
        timeSlot: timeSlotVal,
        eventText: eventTextVal || (statusVal === 'open' ? '週六訓練' : '週六暫停')
      });

      alert("週六開放與行事曆已成功同步至雲端！");
      loadCloudData((data) => {
        cloudData = data;
        renderAdminTable();
      });
    }

    async function handleGeneralDateSubmit(e) {
      e.preventDefault();
      const dateVal = document.getElementById('adminGeneralDate').value;
      const statusVal = document.getElementById('adminGeneralStatus').value;
      const eventTextVal = document.getElementById('adminGeneralEventText').value.trim();

      if (!dateVal) return;

      await sendCloudAction({
        action: 'setDateControl',
        date: dateVal,
        status: statusVal,
        timeSlot: '',
        eventText: eventTextVal
      });

      alert("日期設定與行事曆已更新！");
      loadCloudData((data) => {
        cloudData = data;
        renderAdminTable();
      });
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminTableBody');
      const badge = document.getElementById('regCountBadge');
      const regs = cloudData.registrations;

      badge.innerText = `${regs.length} 筆`;

      if (regs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400 italic">目前沒有任何登記資料</td></tr>';
        return;
      }

      const sorted = [...regs].sort((a, b) => new Date(b.date) - new Date(a.date));

      tbody.innerHTML = sorted.map(r => `
        <tr class="border-b border-slate-100 hover:bg-slate-50">
          <td class="p-3 font-medium text-slate-900 whitespace-nowrap">${r.date}</td>
          <td class="p-3 text-[11px]">${r.time}</td>
          <td class="p-3 font-bold text-slate-800 whitespace-nowrap">${r.studentName}</td>
          <td class="p-3 text-slate-500">${r.account}</td>
          <td class="p-3 text-slate-500">${r.notes || '-'}</td>
          <td class="p-3 text-right whitespace-nowrap">
            <button onclick="deleteRegistration('${r.id}')" class="text-rose-600 font-medium">刪除</button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteRegistration(id) {
      if (!confirm("確定要刪除這筆登記嗎？")) return;
      await sendCloudAction({ action: 'deleteRegistration', id: id });
      loadCloudData((data) => {
        cloudData = data;
        renderAdminTable();
      });
    }
  </script>
</body>
</html>
